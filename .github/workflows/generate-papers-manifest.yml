name: Generate papers manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # The generated commit must not start another generation run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate article HTML pages
        run: python generate_article_pages.py

      - name: Generate papers manifest
        run: python generate_papers_manifest.py

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Papers and Achievements/papers.json" \
            "Papers and Achievements/《时间物质理论与演算宇宙模型》.html" \
            "Papers and Achievements/《欧油一型病毒研究报告》.html" \
            "Papers and Achievements/《黑体生物研究报告》.html"
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate article pages and papers manifest"
          git push
