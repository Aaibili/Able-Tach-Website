name: Generate papers manifest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    # The generated commit must not start another generation run.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate papers manifest
        run: python generate_papers_manifest.py

      - name: Commit generated files when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Papers and Achievements/papers.json"
          if git diff --cached --quiet; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git commit -m "chore: regenerate papers manifest"
          git push
